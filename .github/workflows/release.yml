name: Release → npm

# Publicación en npm con Changesets (mismo flujo que EngineWeb / useful-libs):
#   1. Cada PROSPON incluye un changeset generado con `pnpm changeset`
#      (selección de paquete + major/minor/patch) comiteado junto al cambio.
#   2. En cada push a `main`, `changesets/action` acumula los changesets
#      pendientes en un PR "chore: version packages" que bumppea versiones y
#      genera los CHANGELOG.md.
#   3. Al fusionar ese PR, se ejecuta `pnpm release` (changeset publish) y los
#      paquetes nuevos/cambiados salen a npm.
# Requiere el secret NPM_TOKEN (token de npm con permiso publish); sin el
# secret el job se salta la publicación con un notice.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version + publish con changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lee la versión de pnpm del campo packageManager (pnpm@12.10.1).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build de los paquetes
        run: pnpm build

      - name: Tests
        run: pnpm test:run

      - name: ¿Token de npm disponible?
        id: token
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El secret NPM_TOKEN no está configurado — se omite la publicación."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Version o publish con changesets
        if: steps.token.outputs.available == 'true'
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
