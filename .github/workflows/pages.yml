name: Docs → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Solo un deploy a la vez.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build del sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El sitio de docs (Vite) importa la fuente TS de @qr-render/web:
      # no hace falta build previo de los paquetes.
      - name: Build de la docs (Vite + Shiki)
        run: pnpm docs:build
        env:
          # Pages sirve el repo bajo /QrRender/.
          VITE_BASE: /QrRender/

      - name: Configurar Pages
        uses: actions/configure-pages@v6
        with:
          # Crea/habilita el sitio de Pages automáticamente en el primer push.
          enablement: true

      - name: Subir artifact del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy a Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
